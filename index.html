<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>すりこみ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light dark;
  --bg:#FFFCF2; --paper:#fff;
  --ink:#231815; --ink-soft:#7C716C;
  --yellow:#FFF100; --orange:#F8B62D; --red:#E13922;
  --line:rgba(35,24,21,.18);
  --scrim:rgba(35,24,21,.66);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#2B2724; --paper:#38322E;
    --ink:#FFF7EC; --ink-soft:#B3A69E;
    --line:rgba(255,247,236,.22);
    --scrim:rgba(10,7,5,.72);
  }
}
:root[data-theme="dark"]{
  --bg:#2B2724; --paper:#38322E;
  --ink:#FFF7EC; --ink-soft:#B3A69E;
  --line:rgba(255,247,236,.22);
  --scrim:rgba(10,7,5,.72);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;
  font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',Meiryo,system-ui,sans-serif;
  font-weight:500;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;overflow:hidden;touch-action:manipulation;
}
button,label.pick{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea{user-select:auto;-webkit-user-select:auto}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px;border-radius:6px}
img,svg{display:block}
[hidden]{display:none!important}

#app{position:relative;width:100%;height:100dvh;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  opacity:0;visibility:hidden;pointer-events:none;transition:opacity .4s ease,visibility .4s}
.screen.is-on{opacity:1;visibility:visible;pointer-events:auto}

/* ---------- 1. なかみをえらぶ ---------- */
#screenStart{justify-content:space-between;
  padding:max(26px,env(safe-area-inset-top)) 20px max(22px,env(safe-area-inset-bottom));
  overflow-y:auto;user-select:none}
.head{text-align:center;flex:0 0 auto}
.title{display:flex;justify-content:center;font-weight:900;font-size:clamp(38px,11vmin,60px)}
.title span{display:block;transform-origin:50% 90%}
.title span:nth-child(1){transform:translateY(5px) rotate(-7deg)}
.title span:nth-child(2){transform:translateY(-5px) rotate(-2.5deg)}
.title span:nth-child(3){transform:translateY(-5px) rotate(2.5deg)}
.title span:nth-child(4){transform:translateY(5px) rotate(7deg)}
.lede{margin:12px auto 0;color:var(--ink-soft);font-size:15px;line-height:1.85;max-width:29ch}
.stage-preview{flex:1 1 auto;display:grid;place-items:center;width:100%;min-height:130px}
.foot{flex:0 0 auto;width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:14px}
.pick-label{font-size:13px;color:var(--ink-soft)}
.picks{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.pick{
  position:relative;width:64px;height:64px;border-radius:50%;
  background:var(--paper);border:2.5px solid var(--ink);
  background-size:62%;background-position:center;background-repeat:no-repeat;
  display:grid;place-items:center;overflow:hidden;
  transition:transform .16s cubic-bezier(.34,1.56,.64,1),box-shadow .16s;
}
.pick:hover{transform:translateY(-3px)}
.pick.is-picked{transform:translateY(-4px);box-shadow:0 0 0 4px var(--yellow)}
.pick .photo-icon{width:62%;height:auto}
.pick.has-photo{background-size:cover}
.pick.has-photo .photo-icon{display:none}

.go{
  width:100%;max-width:300px;padding:15px 24px;border-radius:999px;
  background:var(--yellow);color:#231815;font-weight:900;font-size:17px;
  border:3px solid #231815;box-shadow:0 5px 0 #231815;
  transition:transform .1s,box-shadow .1s,opacity .2s;
}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 #231815}
.go:disabled{opacity:.35;cursor:default;transform:none;box-shadow:0 5px 0 #231815}
.go-note{font-size:12px;color:var(--ink-soft);min-height:1.2em;text-align:center}
.ghost{
  padding:11px 18px;border-radius:999px;font-size:14px;font-weight:700;
  background:var(--paper);border:2.5px solid var(--ink);color:var(--ink);
  box-shadow:0 3px 0 var(--ink);transition:transform .1s,box-shadow .1s,opacity .2s;
}
.ghost:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.ghost:disabled{opacity:.3;cursor:default}

/* ---------- 2. 切り抜く → 顔をおく ---------- */
#screenCut{justify-content:space-between;
  padding:max(20px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));user-select:none}
.cut-head{text-align:center;flex:0 0 auto}
.cut-head h2{font-size:19px;font-weight:900}
.cut-head p{margin-top:6px;font-size:13px;color:var(--ink-soft);line-height:1.7}
.cut-area{position:relative;flex:1 1 auto;width:100%;max-width:560px;
  display:grid;place-items:center;margin:14px 0;min-height:0}
#cutBox{position:relative;touch-action:none}
#cutImg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;border-radius:3px;
  pointer-events:none;user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none}
#cutCanvas{position:absolute;inset:0;width:100%;height:100%;border-radius:3px}
#faceBox{position:relative;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#faceBox:active{cursor:grabbing}
#faceImg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
  pointer-events:none;user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none}
.cut-tools{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:440px}
.row{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
.slider{display:flex;align-items:center;gap:12px;width:100%;max-width:290px;font-size:12px;color:var(--ink-soft)}
input[type=range]{flex:1;accent-color:var(--orange);height:26px}

/* ---------- 目と口 ---------- */
.face{position:absolute;width:var(--fw,90px);translate:-50% -50%;z-index:2;pointer-events:none}
.face-svg{width:100%;height:auto;overflow:visible}
.face .eyes ellipse{fill:#231815}
.face .eyes{transform-box:fill-box;transform-origin:center;transition:transform .08s linear}
.face .beak{transform-box:fill-box;transform-origin:50% 0;transition:transform .1s ease-out}
.chirping .face .beak{transform:scaleY(1.45) scaleX(1.08)}

/* ---------- たまご ---------- */
.egg-wrap{position:relative;display:grid;place-items:center}
.egg-wrap .ground{position:absolute;bottom:-10px;width:56%;height:13px;border-radius:50%;
  background:rgba(35,24,21,.18);filter:blur(6px)}
.egg{position:relative;width:var(--egg-w);aspect-ratio:137.08/143.06;will-change:transform}
.egg-svg{width:100%;height:100%}
.egg-svg .peek{filter:blur(2.4px);opacity:.22;transition:opacity .5s}
.egg-svg .cr{fill:none;stroke:#231815;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;
  opacity:0;transition:opacity .2s}
.egg-svg .cr.on{opacity:1}
.egg-svg .drip{opacity:0;transform:translateY(-4px);transition:opacity .35s,transform .5s cubic-bezier(.3,1.4,.5,1)}
.egg-svg .drip.on{opacity:1;transform:translateY(0)}
.splat{position:absolute;left:0;top:0;width:var(--sw,240px);translate:-50% -50%;pointer-events:none;z-index:2}
.splat svg{width:100%;height:auto}
#againBtn{position:absolute;left:50%;translate:-50% 0;
  bottom:max(40px,calc(env(safe-area-inset-bottom) + 30px));width:auto;z-index:5}
.shard{position:absolute;left:50%;top:50%;width:15px;height:13px;
  background:#fff;border:2.5px solid #231815;border-radius:46% 54% 38% 62%/58% 42% 58% 42%;
  pointer-events:none}

/* ---------- 3. あそぶ ---------- */
#screenStage{justify-content:center;touch-action:none}
#field{position:absolute;inset:0}
#field::after{content:'';position:absolute;left:50%;bottom:-20%;translate:-50% 0;
  width:min(640px,115vw);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(255,241,0,.3),transparent 62%);pointer-events:none}
.egg-pos{position:absolute;left:50%;top:50%;translate:-50% -50%;z-index:2}
.hint{position:absolute;left:50%;translate:-50% 0;bottom:max(32px,calc(env(safe-area-inset-bottom) + 22px));
  color:var(--ink-soft);font-size:14px;text-align:center;line-height:1.7;transition:opacity .6s;padding:0 20px}
.status{position:absolute;left:50%;translate:-50% 0;top:max(30px,calc(env(safe-area-inset-top) + 18px));
  font-size:16px;font-weight:700;transition:opacity .35s}

.chick{position:absolute;left:0;top:0;width:0;height:0;will-change:transform;z-index:3}
.chick-shadow{position:absolute;left:50%;translate:-50% 0;border-radius:50%;
  background:rgba(35,24,21,.2);filter:blur(5px)}
.chick-body{position:absolute;will-change:transform;transform-origin:50% 88%}
.chick-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
  pointer-events:none;user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none}
.heart{position:absolute;pointer-events:none;font-size:20px;line-height:1;color:var(--red);z-index:4}
.zzz{position:absolute;pointer-events:none;font-weight:900;line-height:1;color:var(--ink);opacity:.55;z-index:4}

.hud{position:absolute;left:0;right:0;top:0;padding:max(13px,env(safe-area-inset-top)) 14px 0;
  display:flex;align-items:center;gap:10px;opacity:0;transition:opacity .6s;pointer-events:none}
.hud.on{opacity:1;pointer-events:auto}
.meter{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--ink);
  background:var(--paper);border:2.5px solid var(--ink);padding:6px 12px;border-radius:999px}
.bar{width:70px;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0%;border-radius:99px;background:var(--red);
  transition:width .45s cubic-bezier(.22,1,.36,1)}
.hud-sp{flex:1}
.hud button{background:var(--paper);border:2.5px solid var(--ink);padding:7px 13px;
  border-radius:999px;font-size:13px;font-weight:700;color:var(--ink)}
.hud button:active{transform:scale(.95)}
.flash{position:absolute;left:50%;top:50%;translate:-50% -50%;text-align:center;pointer-events:none;opacity:0}
.flash .big{font-size:clamp(46px,15vmin,84px);font-weight:900;color:var(--ink)}
.flash .sub{margin-top:4px;font-size:15px;font-weight:700}
</style>
</head>
<body>
<div id="app">

  <!-- ============ 1. なかみをえらぶ ============ -->
  <section class="screen is-on" id="screenStart">
    <div class="head">
      <h1 class="title" aria-label="すりこみ"><span>す</span><span>り</span><span>こ</span><span>み</span></h1>
      <p class="lede">たまごになかみを入れてあたためると、10秒でかえります。生まれた子は、はじめに見たものについていきます。</p>
    </div>
    <div class="stage-preview">
      <div class="egg-wrap" style="--egg-w:clamp(104px,27vmin,152px)">
        <div class="ground"></div>
        <div class="egg" id="eggPreview"></div>
      </div>
    </div>
    <div class="foot">
      <p class="pick-label">たまごのなかみ</p>
      <div class="picks" id="picks">
        <label class="pick" id="pickFile" aria-label="スマホの写真から選ぶ">
          <input type="file" accept="image/*" id="fileInput" hidden>
          <svg class="photo-icon" viewBox="0 0 48 40" aria-hidden="true">
            <rect x="3" y="5" width="42" height="32" rx="6" fill="none" stroke="#231815" stroke-width="3.4"/>
            <circle cx="15" cy="15.5" r="3.6" fill="#F8B62D" stroke="#231815" stroke-width="2.6"/>
            <path d="M6.5 32.5 L19 20 L27 27.5 L33.5 21.5 L41.5 29.5" fill="none" stroke="#231815"
              stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </label>
      </div>
      <button class="go" id="goBtn" disabled>この中身にする</button>
      <p class="go-note" id="goNote">なかみをえらんでください</p>
    </div>
  </section>

  <!-- ============ 2. 切り抜く → 顔をおく ============ -->
  <section class="screen" id="screenCut">
    <div class="cut-head">
      <h2 id="cutTitle">指でなぞって切り抜く</h2>
      <p id="cutSub">囲んだ内側が、生まれてくる子になります</p>
    </div>
    <div class="cut-area">
      <div id="cutBox">
        <img id="cutImg" alt="切り抜く写真" draggable="false">
        <canvas id="cutCanvas"></canvas>
      </div>
      <div id="faceBox" hidden>
        <img id="faceImg" alt="生まれてくる子" draggable="false">
        <div class="face" id="facePreview"></div>
      </div>
    </div>
    <div class="cut-tools">
      <div class="slider" id="sizeRow" hidden>
        <span>顔の大きさ</span>
        <input type="range" id="faceSize" min="20" max="100" value="55" aria-label="顔の大きさ">
      </div>
      <div class="row" id="cutRow">
        <button class="ghost" id="undoBtn" disabled>やりなおす</button>
        <button class="ghost" id="skipBtn">切らずに使う</button>
        <button class="ghost" id="backBtn">なかみを変える</button>
      </div>
      <div class="row" id="faceRow" hidden>
        <button class="ghost" id="faceBackBtn">もどる</button>
        <button class="ghost" id="noFaceBtn" aria-pressed="false">目と口をつけない</button>
      </div>
      <button class="go" id="cutOkBtn" disabled>切り抜く</button>
    </div>
  </section>

  <!-- ============ 3. たまご → ふ化 → あそぶ ============ -->
  <section class="screen" id="screenStage">
    <div id="field">
      <div class="egg-wrap egg-pos" id="eggHome" style="--egg-w:clamp(148px,39vmin,224px)">
        <div class="ground"></div>
        <div class="egg" id="eggMain"></div>
      </div>
      <div class="splat" id="splat" hidden></div>
      <div class="chick" id="chick" hidden>
        <div class="chick-shadow" id="chickShadow"></div>
        <div class="chick-body" id="chickBody">
          <img class="chick-photo" id="chickPhoto" alt="生まれた子" draggable="false">
          <div class="face" id="faceLive"></div>
        </div>
      </div>
    </div>
    <p class="status" id="status">あたためています</p>
    <p class="hint" id="hint">たまごをつつくと、はやく出てきます</p>
    <div class="hud" id="hud">
      <div class="meter"><span>なつき</span><div class="bar"><i id="bond"></i></div></div>
      <div class="hud-sp"></div>
      <button id="soundBtn" aria-pressed="true">音 ON</button>
      <button id="resetBtn">はじめから</button>
    </div>
    <button class="go" id="againBtn" hidden>もういちど</button>
    <div class="flash" id="flash"><div class="big" id="flashBig">ピヨ</div><div class="sub" id="flashSub">すりこみ完了</div></div>
  </section>
</div>

<script>
/* =====================================================================
   すりこみ
   ---------------------------------------------------------------------
   なかみ / たまご / 目と口 は、いただいた SVG をそのまま埋め込んでいます。
   ・なかみを足す      → CONTENTS に {name, src} を追加
   ・たまごの形を変える → EGG_FILL / EGG_INK のパスを差し替え
   ・顔を変える        → FACE_HTML を差し替え
   音は Web Audio で合成しているので音声ファイルは不要です。
   ===================================================================== */

const Sound = (()=>{
  let ctx=null, master=null, noise=null, on=true;
  try{ on = localStorage.getItem('surikomi-sound') !== 'off'; }catch(e){}
  function init(){
    if(!ctx){
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
      ctx=new AC(); master=ctx.createGain(); master.gain.value=.5; master.connect(ctx.destination);
      const len=Math.floor(ctx.sampleRate*.4); noise=ctx.createBuffer(1,len,ctx.sampleRate);
      const d=noise.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    }
    if(ctx.state==='suspended') ctx.resume();
  }
  function chirp(base=1120,dur=.13,vol=.5){
    if(!on||!ctx) return;
    const t=ctx.currentTime, o=ctx.createOscillator(), g=ctx.createGain();
    o.type='triangle';
    o.frequency.setValueAtTime(base,t);
    o.frequency.exponentialRampToValueAtTime(base*2.15,t+dur*.26);
    o.frequency.exponentialRampToValueAtTime(base*1.12,t+dur);
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+.014);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    const lfo=ctx.createOscillator(), lg=ctx.createGain();
    lfo.frequency.value=42; lg.gain.value=base*.07;
    lfo.connect(lg); lg.connect(o.frequency); lfo.start(t); lfo.stop(t+dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.03);
  }
  function burst(f,q,dur,vol){
    if(!on||!ctx) return;
    const t=ctx.currentTime, s=ctx.createBufferSource(), bp=ctx.createBiquadFilter(), g=ctx.createGain();
    s.buffer=noise; bp.type='bandpass'; bp.frequency.value=f; bp.Q.value=q;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(bp); bp.connect(g); g.connect(master); s.start(t); s.stop(t+dur+.02);
  }
  return {
    init, chirp,
    piyo(h){ chirp(1150,.12,.45); setTimeout(()=>chirp(h?1320:980,.15,.42),155); },
    tok(){ burst(2400,3,.05,.28); },
    crack(){ burst(1500,1.4,.16,.4); burst(600,2,.1,.22); },
    splat(){
      if(!on||!ctx) return;
      burst(420,.7,.34,.5); burst(180,.6,.5,.42);
      const t=ctx.currentTime, o=ctx.createOscillator(), g=ctx.createGain();
      o.type='sine';
      o.frequency.setValueAtTime(320,t);
      o.frequency.exponentialRampToValueAtTime(60,t+.35);
      g.gain.setValueAtTime(.35,t); g.gain.exponentialRampToValueAtTime(.0001,t+.4);
      o.connect(g); g.connect(master); o.start(t); o.stop(t+.42);
    },
    hatch(){ [900,1150,1450,1850].forEach((f,i)=>setTimeout(()=>chirp(f,.13,.45),i*95)); },
    get on(){return on;},
    toggle(){ on=!on; init(); try{localStorage.setItem('surikomi-sound',on?'on':'off');}catch(e){}
      if(on) chirp(1200,.1,.4); return on; }
  };
})();

/* 大きすぎる画像はブラウザの描画（とくに SVG 内のぼかし）を壊すので、
   取り込んだ時点で扱いやすいサイズに落としておく。失敗しても元の画像で続行する。 */
function rasterize(src,max,mime,quality){
  return new Promise(res=>{
    const im=new Image();
    im.onload=()=>{
      try{
        const nw=im.naturalWidth||max, nh=im.naturalHeight||max;
        const s=Math.min(1,max/Math.max(nw,nh));
        const c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(nw*s)); c.height=Math.max(1,Math.round(nh*s));
        const g=c.getContext('2d');
        g.drawImage(im,0,0,c.width,c.height);
        res(c.toDataURL(mime,quality));
      }catch(e){ res(src); }
    };
    im.onerror=()=>res(src);
    im.src=src;
  });
}
/* たまごの中に透ける用の小さい画像 */
let peekToken=0;
function setPeek(src,el){
  const my=++peekToken;
  el.setAttribute('href',src);
  rasterize(src,320,'image/png').then(small=>{
    if(my===peekToken) el.setAttribute('href',small);
  });
}

const CRACKS=[...$('eggMain').querySelectorAll('.cr')];

/* =====================================================================
   1. なかみをえらぶ
   ===================================================================== */
const picks=$('picks'), pickFile=$('pickFile'), fileInput=$('fileInput');
const goBtn=$('goBtn'), goNote=$('goNote');
let rawSrc=null, fromPhone=false;

CONTENTS.forEach(p=>{
  const b=document.createElement('button');
  b.className='pick'; b.type='button';
  b.style.backgroundImage=`url("${p.src}")`;
  b.setAttribute('aria-label',p.name);

function choose(src,el,phone){
  rawSrc=src; fromPhone=phone;
  document.querySelectorAll('.pick').forEach(p=>p.classList.remove('is-picked'));
  if(el) el.classList.add('is-picked');

fileInput.addEventListener('change',e=>{

goBtn.addEventListener('click',()=>{

  else { bodySrc=rawSrc; show(screenCut); state='cut'; toFaceMode(false); }
});

/* =====================================================================
   2. 切り抜き → 顔をおく
   ===================================================================== */
const cutBox=$('cutBox'), cutImg=$('cutImg'), cutCanvas=$('cutCanvas');
const cutTitle=$('cutTitle'), cutSub=$('cutSub'), cutRow=$('cutRow'), faceRow=$('faceRow');
const undoBtn=$('undoBtn'), skipBtn=$('skipBtn'), backBtn=$('backBtn');
const faceBackBtn=$('faceBackBtn'), noFaceBtn=$('noFaceBtn'), cutOkBtn=$('cutOkBtn');
const faceBox=$('faceBox'), faceImg=$('faceImg'), facePreview=$('facePreview');
const sizeRow=$('sizeRow'), faceSize=$('faceSize');
const ctx2=cutCanvas.getContext('2d');

let srcImg=new Image(), bodySrc=null, bodyImg=new Image();
let path=[], drawing=false, cutMode='cut';
let face={x:.5,y:.4,unit:.55};
let useFace=true;

function openCut(){
  cutMode='cut'; path=[]; drawing=false;
  show(screenCut); state='cut';
  faceBox.hidden=true; cutBox.hidden=false;
  sizeRow.hidden=true; faceRow.hidden=true; cutRow.hidden=false;
  cutTitle.textContent='指でなぞって切り抜く';
  cutSub.textContent='囲んだ内側が、生まれてくる子になります';
  cutOkBtn.textContent='切り抜く'; cutOkBtn.disabled=true; undoBtn.disabled=true;
  srcImg=new Image(); srcImg.onload=layoutCut; srcImg.src=rawSrc;
  cutImg.src=rawSrc;
}
function fitBox(box,natW,natH){
  const area=box.parentElement.getBoundingClientRect();
  const maxW=Math.min(area.width||320,560), maxH=Math.max(150,area.height||240);
  const s=Math.min(maxW/natW,maxH/natH);
  const w=Math.max(60,Math.round(natW*s)), h=Math.max(60,Math.round(natH*s));
  box.style.width=w+'px'; box.style.height=h+'px';
  return {w,h};
}
function layoutCut(){
  if(!srcImg.naturalWidth) return;
  const {w,h}=fitBox(cutBox,srcImg.naturalWidth,srcImg.naturalHeight);
  const dpr=Math.min(2,devicePixelRatio||1);
  cutCanvas.width=Math.round(w*dpr); cutCanvas.height=Math.round(h*dpr);
  ctx2.setTransform(dpr,0,0,dpr,0,0);
  paintCut();
}
function tracePath(g,pts,w,h){
  g.beginPath();
  g.moveTo(pts[0].x*w,pts[0].y*h);
  for(let i=1;i<pts.length-1;i++){
    const a=pts[i], b=pts[i+1];
    g.quadraticCurveTo(a.x*w,a.y*h,(a.x+b.x)/2*w,(a.y+b.y)/2*h);
  }
  const last=pts[pts.length-1];
  g.lineTo(last.x*w,last.y*h);
}
function paintCut(){
  const w=cutCanvas.clientWidth, h=cutCanvas.clientHeight;
  ctx2.clearRect(0,0,w,h);
  const scrim=getComputedStyle(document.documentElement).getPropertyValue('--scrim').trim()||'rgba(35,24,21,.66)';
  ctx2.fillStyle=scrim; ctx2.fillRect(0,0,w,h);
  if(path.length>1){
    ctx2.save();
    ctx2.globalCompositeOperation='destination-out';
    tracePath(ctx2,path,w,h); ctx2.closePath(); ctx2.fill();
    ctx2.restore();
    ctx2.save();
    tracePath(ctx2,path,w,h);
    if(!drawing) ctx2.closePath();
    ctx2.strokeStyle='#FFF100'; ctx2.lineWidth=3;
    ctx2.lineJoin='round'; ctx2.lineCap='round';
    ctx2.setLineDash(drawing?[]:[7,5]);
    ctx2.stroke();
    ctx2.restore();
  }
}
function pos(e){
  const r=cutCanvas.getBoundingClientRect();
  return {x:(e.clientX-r.left)/r.width, y:(e.clientY-r.top)/r.height};
}
cutCanvas.addEventListener('pointerdown',e=>{
  if(cutMode!=='cut') return;
  cutCanvas.setPointerCapture(e.pointerId);
  drawing=true; path=[pos(e)]; paintCut(); Sound.init();
});
cutCanvas.addEventListener('pointermove',e=>{
  if(!drawing) return;
  const p=pos(e), last=path[path.length-1];
  if(Math.hypot(p.x-last.x,p.y-last.y)<.006) return;
  path.push(p); paintCut();
});
function endDraw(){
  if(!drawing) return;
  drawing=false; paintCut();
  const ok=path.length>=8;
  cutOkBtn.disabled=!ok; undoBtn.disabled=false;
  if(ok) Sound.tok();
}
cutCanvas.addEventListener('pointerup',endDraw);
cutCanvas.addEventListener('pointercancel',endDraw);
undoBtn.addEventListener('click',()=>{ path=[]; paintCut(); cutOkBtn.disabled=true; undoBtn.disabled=true; });
backBtn.addEventListener('click',()=>{ show(screenStart); state='start'; });
skipBtn.addEventListener('click',()=>{ bodySrc=rawSrc; toFaceMode(false); });
faceBackBtn.addEventListener('click',()=>{
  if(fromPhone) openCut(); else { show(screenStart); state='start'; }
});
cutOkBtn.addEventListener('click',()=>{ cutMode==='cut' ? applyCut() : startIncubation(); });

function applyCut(){
  const NW=srcImg.naturalWidth, NH=srcImg.naturalHeight;
  let minX=1,minY=1,maxX=0,maxY=0;
  path.forEach(p=>{ minX=Math.min(minX,p.x); minY=Math.min(minY,p.y);
                    maxX=Math.max(maxX,p.x); maxY=Math.max(maxY,p.y); });
  minX=Math.max(0,minX); minY=Math.max(0,minY);
  maxX=Math.min(1,maxX); maxY=Math.min(1,maxY);
  const bw=(maxX-minX)*NW, bh=(maxY-minY)*NH;
  if(bw<12||bh<12){ bodySrc=rawSrc; toFaceMode(false); return; }
  const s=Math.min(1,760/Math.max(bw,bh));
  const c=document.createElement('canvas');
  c.width=Math.max(8,Math.round(bw*s)); c.height=Math.max(8,Math.round(bh*s));
  const g=c.getContext('2d');
  g.save(); g.scale(s,s); g.translate(-minX*NW,-minY*NH);
  tracePath(g,path,NW,NH); g.closePath(); g.clip();
  g.drawImage(srcImg,0,0,NW,NH);
  g.restore();
  try{ bodySrc=c.toDataURL('image/png'); autoFace(c); toFaceMode(true); }
  catch(err){ bodySrc=rawSrc; toFaceMode(false); }
}
function autoFace(c){
  try{
    const g=c.getContext('2d'), w=c.width, h=c.height;
    const d=g.getImageData(0,0,w,h).data;
    const top=Math.max(2,Math.floor(h*.58));
    let sx=0,sy=0,n=0;
    for(let y=0;y<top;y+=2) for(let x=0;x<w;x+=2){
      if(d[(y*w+x)*4+3]>128){ sx+=x; sy+=y; n++; }
    }
    if(n>40){
      let fx=sx/n, fy=sy/n;
      if(d[((Math.floor(fy)*w)+Math.floor(fx))*4+3]<=128){ fx=w/2; fy=top*.6; }
      face.x=fx/w; face.y=fy/h;
    }else{ face.x=.5; face.y=.4; }
  }catch(e){ face.x=.5; face.y=.4; }
}

function toFaceMode(wasCut){
  cutMode='face';
  if(!wasCut){ face.x=.5; face.y=.4; }
  cutBox.hidden=true; faceBox.hidden=false;
  cutRow.hidden=true; faceRow.hidden=false; sizeRow.hidden=false;
  cutTitle.textContent='顔の位置を決める';
  cutOkBtn.textContent='あたためる'; cutOkBtn.disabled=false;
  syncFaceUI();
  bodyImg=new Image();
  bodyImg.onload=()=>{ layoutFaceBox(); Sound.piyo(); };
  bodyImg.src=bodySrc;
  faceImg.src=bodySrc;
}
function layoutFaceBox(){
  if(!bodyImg.naturalWidth) return;
  fitBox(faceBox,bodyImg.naturalWidth,bodyImg.naturalHeight);
  drawFacePreview();
}
function drawFacePreview(){
  const w=faceBox.clientWidth, h=faceBox.clientHeight;
  facePreview.style.left=(face.x*w)+'px';
  facePreview.style.top=(face.y*h)+'px';
  facePreview.style.setProperty('--fw',(Math.min(w,h)*face.unit)+'px');
}
function syncFaceUI(){
  facePreview.hidden=!useFace;
  sizeRow.hidden=!useFace;
  noFaceBtn.textContent = useFace ? '目と口をつけない' : '目と口をつける';
  noFaceBtn.setAttribute('aria-pressed', String(!useFace));
  faceBox.style.cursor = useFace ? 'grab' : 'default';
  cutSub.textContent = useFace
    ? 'ドラッグで動かして、スライダーで大きさを変えられます'
    : 'このまま、目と口なしで生まれます';
}
noFaceBtn.addEventListener('click',()=>{ useFace=!useFace; syncFaceUI(); Sound.tok(); });

let dragging=false;
faceBox.addEventListener('dragstart',e=>e.preventDefault());
faceBox.addEventListener('pointerdown',e=>{
  if(!useFace) return;
  e.preventDefault();
  dragging=true; faceBox.setPointerCapture(e.pointerId); moveFace(e);
});
faceBox.addEventListener('pointermove',e=>{ if(dragging){ e.preventDefault(); moveFace(e); } });
faceBox.addEventListener('pointerup',()=>{dragging=false;});
faceBox.addEventListener('pointercancel',()=>{dragging=false;});
function moveFace(e){
  if(!useFace) return;
  const r=faceBox.getBoundingClientRect();
  face.x=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
  face.y=Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));
  drawFacePreview();
}
faceSize.addEventListener('input',()=>{ face.unit=faceSize.value/100; drawFacePreview(); });
face.unit=faceSize.value/100;

/* =====================================================================
   3. たまご → ふ化
   ===================================================================== */
const eggHome=$('eggHome'), eggMain=$('eggMain'), field=$('field');
const statusEl=$('status'), hintEl=$('hint'), hud=$('hud'), bond=$('bond'), flash=$('flash');
const TOTAL=10;              /* ← ふ化までの秒数（つついても早くなりません） */
const STAGES=[.34,.60,.85];
const BREAK_AT=4;            /* ← これだけつつくと割れて生卵になる */
const HEAL=.15;              /* 1秒あたり、つついたダメージが回復する量 */
const splat=$('splat'), againBtn=$('againBtn'), flashBig=$('flashBig'), flashSub=$('flashSub');
const DRIPS=[...$('eggMain').querySelectorAll('.drip')];
let warm=0, wobT=0, crackStage=0, lastT=0, damage=0, jolt=0, statusTimer=null;

function setStatus(txt){
  statusEl.textContent=txt;
  statusEl.animate([{opacity:0},{opacity:1}],{duration:260});
}
function normalStatus(){
  return ['あたためています','もぞもぞ動いている','ヒビが入った','いま、出てくる'][crackStage];
}

function startIncubation(){
  Sound.init();
  setPeek(bodySrc,peekMain);
  chickPhoto.src=bodySrc;
  show(screenStage);
  eggMain.getAnimations().forEach(a=>a.cancel());
  warm=0; wobT=0; crackStage=0;
  CRACKS.forEach(c=>c.classList.remove('on'));
  eggMain.style.opacity='1'; eggMain.style.transform='';
  eggHome.hidden=false; chickEl.hidden=true;
  splat.hidden=true; splat.innerHTML=''; againBtn.hidden=true;
  damage=0; jolt=0;
  DRIPS.forEach(d=>d.classList.remove('on'));
  clearTimeout(statusTimer);
  statusEl.textContent='あたためています'; statusEl.style.opacity='1';
  hintEl.textContent='そっとしておくと、生まれます'; hintEl.style.opacity='1';
  hud.classList.remove('on');
  state='egg'; lastT=performance.now();
}
eggMain.addEventListener('pointerdown',e=>{
  if(state!=='egg') return;
  e.stopPropagation();
  damage+=1; jolt=1; Sound.tok();
  const lv=Math.min(3,Math.floor(damage));
  DRIPS[0].classList.toggle('on', damage>=2);
  DRIPS[1].classList.toggle('on', damage>=3);
  if(damage>=BREAK_AT){ breakEgg(); return; }
  setStatus(['','ゆれた。そっとしておこう','なかみが揺さぶられている','われる。もうやめて'][lv]);
  clearTimeout(statusTimer);
  statusTimer=setTimeout(()=>{ if(state==='egg') setStatus(normalStatus()); },1900);
  eggMain.animate([{transform:'scale(1) rotate(0deg)'},{transform:'scale(.9,1.1) rotate(-6deg)'},
    {transform:'scale(1.06,.94) rotate(5deg)'},{transform:'scale(1) rotate(0deg)'}],
    {duration:300,easing:'ease-out'});
});
function eggFrame(dt){
  warm=Math.min(warm+dt,TOTAL);
  damage=Math.max(0,damage-HEAL*dt);
  if(damage<2) DRIPS[0].classList.remove('on');
  if(damage<3) DRIPS[1].classList.remove('on');
  jolt=Math.max(0,jolt-dt*2.2);
  const p=warm/TOTAL;
  wobT+=dt*(2.4+p*7);
  const amp=(reduce?1:1.2)+p*(reduce?2:5.5)+jolt*(reduce?1:4);
  eggMain.style.transform=`rotate(${Math.sin(wobT)*amp}deg) translateY(${Math.abs(Math.sin(wobT*2))*p*-4}px)`;
  peekMain.style.opacity=String(.2+p*.34);
  while(crackStage<3 && p>=STAGES[crackStage]){
    CRACKS[crackStage].classList.add('on'); crackStage++;
    Sound.crack();
    clearTimeout(statusTimer);
    setStatus(normalStatus());
  }
  if(p>=1) hatch();
}

/* つつきすぎて割れたとき */
function breakEgg(){
  state='broken';
  clearTimeout(statusTimer);
  Sound.splat();
  CRACKS.forEach(c=>c.classList.add('on'));
  const r=eggMain.getBoundingClientRect(), f=field.getBoundingClientRect();
  const cx=r.left+r.width/2-f.left, cy=r.top+r.height/2-f.top;
  shatter(reduce?5:12, .55);
  eggMain.animate([
    {transform:'scale(1.08,.9)',opacity:1},
    {transform:'scale(.7,1.05)',opacity:0}
  ],{duration:260,easing:'ease-in',fill:'forwards'});
  statusEl.style.opacity='0'; hintEl.style.opacity='0';
  setTimeout(()=>{
    eggHome.hidden=true;
    splat.style.left=cx+'px';
    splat.style.top=(cy+r.height*.22)+'px';
    splat.style.setProperty('--sw', Math.round(r.width*1.5)+'px');
    splat.innerHTML=SPLAT_HTML;
    splat.hidden=false;
    splat.animate([
      {transform:'translate(-50%,-50%) scale(.2,.5)',opacity:0},
      {transform:'translate(-50%,-50%) scale(1.14,.86)',opacity:1,offset:.45},
      {transform:'translate(-50%,-50%) scale(.97,1.04)',offset:.72},
      {transform:'translate(-50%,-50%) scale(1,1)'}
    ],{duration:620,easing:'cubic-bezier(.3,1.1,.4,1)'});
    flashBig.textContent='生卵'; flashSub.textContent='つつきすぎた';
    flash.animate([
      {opacity:0,transform:'translate(-50%,-50%) scale(.6)'},
      {opacity:1,transform:'translate(-50%,-50%) scale(1)',offset:.22},
      {opacity:1,transform:'translate(-50%,-56%) scale(1)',offset:.66},
      {opacity:0,transform:'translate(-50%,-62%) scale(1.03)'}
    ],{duration:2000,easing:'cubic-bezier(.2,.9,.3,1)'});
    setTimeout(()=>{ againBtn.hidden=false;
      againBtn.animate([{opacity:0},{opacity:1}],{duration:400}); },1500);
  },240);
}
const SPLAT_HTML=`<svg viewBox="0 0 220 132" aria-label="生卵">
  <g fill="#fff" stroke="#231815" stroke-width="5" stroke-linejoin="round">
    <path d="M22,80C14,60 36,42 64,38 84,35 88,20 106,22c17,2 20,15 42,19 28,5 50,20 44,40-6,19-42,31-84,31C66,112 30,99 22,80Z"/>
    <circle cx="14" cy="104" r="7"/><circle cx="205" cy="96" r="6"/>
    <circle cx="52" cy="22" r="5.5"/><circle cx="168" cy="16" r="4.5"/>
  </g>
  <ellipse cx="112" cy="70" rx="30" ry="25" fill="#F8B62D" stroke="#231815" stroke-width="5"/>
</svg>`;
function shatter(n,power){
  for(let i=0;i<n;i++){
    const s=document.createElement('div'); s.className='shard';
    const sz=9+Math.random()*12;
    s.style.width=sz+'px'; s.style.height=(sz*.85)+'px';
    eggHome.appendChild(s);
    const ang=(i/n)*Math.PI*2+Math.random()*.5, dist=(70+Math.random()*130)*power;
    s.animate([
      {transform:'translate(-50%,-50%) rotate(0deg)',opacity:1},
      {transform:`translate(${Math.cos(ang)*dist-8}px,${Math.sin(ang)*dist*.8-40*power}px) rotate(${Math.random()*720-360}deg)`,opacity:1,offset:.55},
      {transform:`translate(${Math.cos(ang)*dist*1.15-8}px,${Math.sin(ang)*dist*.8+180}px) rotate(${Math.random()*900-450}deg)`,opacity:0}
    ],{duration:1100+Math.random()*500,easing:'cubic-bezier(.2,.7,.4,1)',fill:'forwards'});
    setTimeout(()=>s.remove(),1700);
  }
}
function hatch(){
  state='hatch'; Sound.hatch();
  const r=eggMain.getBoundingClientRect(), f=field.getBoundingClientRect();
  const cx=r.left+r.width/2-f.left, cy=r.top+r.height/2-f.top;
  shatter(reduce?6:14,1);
  eggMain.animate([{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(.82)'}],
    {duration:320,easing:'ease-in',fill:'forwards'});
  statusEl.style.opacity='0'; hintEl.style.opacity='0';
  setTimeout(()=>{ eggHome.hidden=true; startPlay(cx,cy); },300);
  flashBig.textContent='ピヨ'; flashSub.textContent='すりこみ完了';
  flash.animate([
    {opacity:0,transform:'translate(-50%,-50%) scale(.6)'},
    {opacity:1,transform:'translate(-50%,-50%) scale(1)',offset:.22},
    {opacity:1,transform:'translate(-50%,-56%) scale(1)',offset:.62},
    {opacity:0,transform:'translate(-50%,-64%) scale(1.04)'}
  ],{duration:1900,easing:'cubic-bezier(.2,.9,.3,1)'});
}

/* =====================================================================
   4. あそぶ
   ===================================================================== */
const chickEl=$('chick'), chickBody=$('chickBody'), chickPhoto=$('chickPhoto');
const chickShadow=$('chickShadow'), faceLive=$('faceLive');
const eyesLive=faceLive.querySelector('.eyes');
const chick={x:0,y:0,tx:0,ty:0,phase:0,lean:0,bob:0,walking:false,w:0,h:0,look:{x:0,y:0}};
let bondVal=0, idleT=0, userT=0, lastChirp=0, lastZ=0;
let maxed=false, blinking=false, sleeping=false;
const SLEEP_AT=14;   /* ← 何秒ほっとくと寝るか */

function sizeChick(){
  const base=Math.max(110,Math.min(196,Math.min(innerWidth,innerHeight)*.31));
  const nw=bodyImg.naturalWidth||1, nh=bodyImg.naturalHeight||1;
  const s=base/Math.max(nw,nh);
  chick.w=Math.max(40,Math.round(nw*s)); chick.h=Math.max(40,Math.round(nh*s));
  chickBody.style.width=chick.w+'px'; chickBody.style.height=chick.h+'px';
  chickBody.style.left=(-chick.w/2)+'px'; chickBody.style.top=(-chick.h/2)+'px';
  faceLive.hidden=!useFace;
  faceLive.style.left=(face.x*chick.w)+'px';
  faceLive.style.top=(face.y*chick.h)+'px';
  faceLive.style.setProperty('--fw',(Math.min(chick.w,chick.h)*face.unit)+'px');
  chickShadow.style.width=(chick.w*.58)+'px';
  chickShadow.style.height=Math.max(8,chick.h*.11)+'px';
  chickShadow.style.top=(chick.h/2-3)+'px';
}
function startPlay(cx,cy){
  chickPhoto.src=bodySrc;
  sizeChick();
  chick.x=cx; chick.y=cy; chick.tx=cx; chick.ty=cy;
  chickEl.hidden=false; place();
  chickBody.animate([
    {transform:'scale(0) translateY(30px)'},
    {transform:'scale(1.2) translateY(-14px)',offset:.45},
    {transform:'scale(.93) translateY(4px)',offset:.72},
    {transform:'scale(1) translateY(0)'}
  ],{duration:750,easing:'cubic-bezier(.3,1.2,.4,1)'});
  setTimeout(()=>{ Sound.piyo(); doChirp(); },260);
  state='play'; bondVal=0; maxed=false; idleT=0; userT=0; sleeping=false;
  bond.style.width='0%';
  hud.classList.add('on');
  setTimeout(()=>{ hintEl.textContent='画面をタップすると、ついてきます'; hintEl.style.opacity='1'; },1700);
}
function place(){ chickEl.style.transform=`translate(${chick.x}px,${chick.y}px)`; }
function setTarget(x,y){
  const px=chick.w/2+10, py=chick.h/2+10;
  chick.tx=Math.max(px,Math.min(innerWidth-px,x));
  chick.ty=Math.max(py+44,Math.min(innerHeight-py-14,y));
  idleT=0;
}
screenStage.addEventListener('pointerdown',e=>{
  if(state!=='play') return;
  e.preventDefault();
  Sound.init();
  userT=0;
  if(sleeping){ wake(); return; }
  const f=field.getBoundingClientRect();
  setTarget(e.clientX-f.left,e.clientY-f.top);
  hintEl.style.opacity='0';
});
hud.addEventListener('pointerdown',e=>e.stopPropagation());
addEventListener('pointermove',e=>{
  if(state!=='play'||e.pointerType!=='mouse') return;
  const f=field.getBoundingClientRect();
  chick.look.x=e.clientX-f.left; chick.look.y=e.clientY-f.top;
});
function fallAsleep(){
  sleeping=true; lastZ=0;
  chickBody.animate([{transform:'scale(1,1)'},{transform:'scale(1.05,.95)'},{transform:'scale(1,1)'}],
    {duration:600,easing:'ease-in-out'});
  hintEl.textContent='すやすや。タップで起きます';
  hintEl.style.opacity='1';
}
function wake(){
  if(!sleeping) return;
  sleeping=false; userT=0;
  hintEl.style.opacity='0';
  hop(); doChirp(); Sound.piyo();
}
function zzz(){
  const z=document.createElement('div');
  z.className='zzz'; z.textContent='Z';
  z.style.fontSize=Math.round(Math.max(13,chick.h*.16))+'px';
  z.style.left=(chick.x+chick.w*.3)+'px';
  z.style.top=(chick.y-chick.h*.45)+'px';
  field.appendChild(z);
  z.animate([
    {transform:'translate(0,0) rotate(-8deg) scale(.5)',opacity:0},
    {transform:'translate(16px,-22px) rotate(6deg) scale(1)',opacity:.6,offset:.35},
    {transform:'translate(38px,-62px) rotate(14deg) scale(1.1)',opacity:0}
  ],{duration:2600,easing:'ease-out'});
  setTimeout(()=>z.remove(),2700);
}
function doChirp(){
  chickEl.classList.add('chirping');
  setTimeout(()=>chickEl.classList.remove('chirping'),220);
}
function hop(){
  chickBody.animate([
    {transform:'translateY(0) scale(1,1)'},
    {transform:'translateY(0) scale(1.09,.89)',offset:.18},
    {transform:'translateY(-14px) scale(.94,1.09)',offset:.5},
    {transform:'translateY(0) scale(1.05,.95)',offset:.82},
    {transform:'translateY(0) scale(1,1)'}
  ],{duration:420,easing:'ease-out'});
}
function heart(){
  const h=document.createElement('div');
  h.className='heart'; h.textContent='♥';
  h.style.left=(chick.x-8)+'px'; h.style.top=(chick.y-chick.h/2-6)+'px';
  field.appendChild(h);
  h.animate([
    {transform:'translateY(0) scale(.5)',opacity:0},
    {transform:'translateY(-26px) scale(1.1)',opacity:1,offset:.3},
    {transform:'translateY(-64px) scale(.9)',opacity:0}
  ],{duration:1100,easing:'ease-out'});
  setTimeout(()=>h.remove(),1200);
}
function addBond(){
  if(bondVal>=100) return;
  bondVal=Math.min(100,bondVal+7);
  bond.style.width=bondVal+'%';
  if(bondVal>=100&&!maxed){
    maxed=true;
    hintEl.textContent='もう、あなたしか見えていない';
    hintEl.style.opacity='1';
    for(let i=0;i<5;i++) setTimeout(heart,i*130);
    Sound.piyo(true);
  }
}
function playFrame(dt,now){
  const dx=chick.tx-chick.x, dy=chick.ty-chick.y, d=Math.hypot(dx,dy);
  const was=chick.walking;
  chick.walking=d>5;
  if(chick.walking){
    const m=Math.min((125+bondVal*.75)*dt,d);
    chick.x+=dx/d*m; chick.y+=dy/d*m;
    chick.phase+=dt*11;
    chick.bob=Math.abs(Math.sin(chick.phase))*(chick.h*.07);
    chick.lean+=((dx/Math.max(d,1))*8-chick.lean)*Math.min(1,dt*7);
  }else{
    chick.phase=0;
    chick.bob+=(0-chick.bob)*Math.min(1,dt*9);
    chick.lean+=(0-chick.lean)*Math.min(1,dt*6);
    if(was){ hop(); doChirp(); Sound.piyo(bondVal>=70); addBond(); if(bondVal>60) heart(); }
  }
  place();
  const breathe=reduce?0:(sleeping ? Math.sin(now/1500)*(chick.h*.024) : Math.sin(now/620)*(chick.h*.008));
  const sway=(sleeping&&!reduce) ? Math.sin(now/2100)*1.8 : 0;
  chickBody.style.transform=`translateY(${-chick.bob+breathe}px) rotate(${chick.lean+sway}deg)`;
  const k=chick.bob/Math.max(1,chick.h*.09);
  chickShadow.style.transform=`translate(-50%,0) scale(${1-k*.14},${1-k*.3})`;
  chickShadow.style.opacity=String(.9-k*.3);

  const lx=chick.walking?chick.tx:(chick.look.x||chick.tx);
  const ly=chick.walking?chick.ty:(chick.look.y||chick.ty);
  const ang=Math.atan2(ly-chick.y,lx-chick.x);
  const dd=Math.min(1,Math.hypot(lx-chick.x,ly-chick.y)/170);
  const ex=sleeping?0:Math.cos(ang)*dd*1.1, ey=sleeping?0:Math.sin(ang)*dd*.8;
  const open=sleeping?.09:(blinking?.12:1);
  eyesLive.style.transform=`translate(${ex}px,${ey}px) scaleY(${open})`;

  idleT+=dt; userT+=dt;
  if(sleeping){
    if(now-lastZ>2300){ lastZ=now; zzz(); }
    return;
  }
  if(!chick.walking&&userT>SLEEP_AT){ fallAsleep(); return; }
  if(idleT>4.5&&!chick.walking&&!reduce){
    idleT=0;
    setTarget(chick.x+(Math.random()*150-75), chick.y+(Math.random()*110-55));
  }
  if(now-lastChirp>7000+Math.random()*5000&&!chick.walking){
    lastChirp=now; Sound.chirp(1050,.12,.3); doChirp();
  }
}
setInterval(()=>{
  if(state!=='play'||reduce) return;
  blinking=true; setTimeout(()=>{blinking=false;},130);
},3400);

addEventListener('resize',()=>{
  if(state==='cut'){ cutMode==='cut' ? layoutCut() : layoutFaceBox(); }
  if(state==='play'){ sizeChick(); setTarget(chick.tx,chick.ty); }
});

function loop(now){
  const dt=Math.min(.05,(now-lastT)/1000)||0;
  lastT=now;
  if(state==='egg') eggFrame(dt);
  else if(state==='play') playFrame(dt,now);
  requestAnimationFrame(loop);
}
requestAnimationFrame(t=>{lastT=t;loop(t);});

/* ---- スマホ：ダブルタップ拡大・ピンチ・長押し選択を止める ---- */
let lastTouchEnd=0;
document.addEventListener('touchend',e=>{
  if(e.target.closest('label,input,button')) { lastTouchEnd=Date.now(); return; }
  const t=Date.now();
  if(t-lastTouchEnd<340) e.preventDefault();
  lastTouchEnd=t;
},{passive:false});
['gesturestart','gesturechange','gestureend'].forEach(t=>
  document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
document.addEventListener('contextmenu',e=>{
  if(e.target.closest('img,canvas,svg')) e.preventDefault();
});

/* ---- HUD ---- */
const soundBtn=$('soundBtn'), resetBtn=$('resetBtn');
soundBtn.textContent=Sound.on?'音 ON':'音 OFF';
soundBtn.addEventListener('click',()=>{
  const on=Sound.toggle();
  soundBtn.textContent=on?'音 ON':'音 OFF';
  soundBtn.setAttribute('aria-pressed',String(on));
});
againBtn.addEventListener('click',()=>{
  againBtn.hidden=true; splat.hidden=true; splat.innerHTML='';
  state='start'; show(screenStart);
});
resetBtn.addEventListener('click',()=>{
  state='start'; hud.classList.remove('on'); chickEl.hidden=true;
  bondVal=0; bond.style.width='0%';
  show(screenStart);
});
</script>
